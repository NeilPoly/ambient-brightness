; 环境光传感器的板子程序：微雪 ESP32-C3-Zero（4MB 闪存，原生 USB）
;
; 编译并烧录（板子插 Mac 的 USB 口，在 firmware 目录）：
;     pio run -t upload
; 看输出：
;     pio device monitor
;
; 平台用 tasmota 版 espressif32 2024.06.00（Arduino 2.0.18）。
; 板子没有专门的定义，用乐鑫 C3 开发板的（同样是 4MB 闪存）。
;
; 本机专用的设置（比如换编译器路径）写在同目录的 platformio.local.ini 里，不进 git，
; 格式和这里一样，用 [env:c3zero] 开头写要覆盖的项。没有这个文件也能正常编译。
[platformio]
extra_configs = platformio.local.ini

[env:c3zero]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.00/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
; 注意：这个平台带的 RISC-V 编译器是 Intel 版。Apple 芯片的 Mac 要么装 Rosetta，
; 要么下载乐鑫官方同版本（esp-2021r2-patch5）的 arm64 原生版，在 platformio.local.ini 里写：
;     [env:c3zero]
;     platform_packages = toolchain-riscv32-esp @ symlink:///编译器解压后的目录
monitor_speed = 115200
; 串口走芯片自带的 USB（不经过串口芯片），开机就用 USB 当 Serial
; FW_VERSION：网页和开机消息里显示的固件版本（0.1 是只发串口的版本，0.2 起板子自己调亮度）
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DFW_VERSION="0.3.0"'
; 闪存分区用默认的：两块各 1.25 MB 的程序区（网页升级固件时写另一块）+ 1.4 MB 给 LittleFS 存记录
board_build.partitions = default.csv
board_build.filesystem = littlefs
; 编译前把 web/ 里的网页压缩进固件（生成 src/web_assets.h）
extra_scripts = pre:embed_web.py
;
; 板子装好以后不用插 USB 也能升级：在 http://ambient.local/settings 上传 .pio/build/c3zero/firmware.bin，
; 或者 curl -F firmware=@.pio/build/c3zero/firmware.bin http://ambient.local/update
