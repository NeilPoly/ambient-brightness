<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>环境光调亮度：配 Wi-Fi</title>
<!--
  板子的配网页。板子没存 Wi-Fi、或者开机 30 秒连不上时会开热点 Ambient-xxxx（不用密码），手机连上以后自动弹出这一页
  （也可以开 http://192.168.4.1）；连着家里 Wi-Fi 时是 http://ambient.local/wifi ，用来换一个 Wi-Fi。
  选好、输密码，POST /api/wifi，板子存起来重启去连。ESP32-C3 只能连 2.4 GHz。压缩在固件里（../embed_web.py）。
-->
<style>
  :root {
    color-scheme: light;
    --bg: #eef1f4;
    --ink: #171a1e;
    --muted: #58616c;
    --sheet: #fff;
    --rule: #dde2e7;
    --accent: #ff8a00;
    --ok: #2c7a3a;
    --bad: #b3261e;
    --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
  main { max-inline-size: 520px; margin-inline: auto; padding: 24px 16px 48px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .sheet { margin-block-start: 14px; background: var(--sheet); border: 1.5px solid var(--ink); padding: 12px 14px 14px; }
  h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  h2 button { margin-inline-start: auto; }
  ul { list-style: none; margin: 0; padding: 0; }
  li label { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-block-end: 1px solid var(--rule); cursor: pointer; }
  li:last-child label { border-block-end: 0; }
  li input { inline-size: 18px; block-size: 18px; accent-color: var(--ink); }
  li .name { flex: 1; overflow-wrap: anywhere; }
  li .sig { color: var(--muted); font-size: 13px; white-space: nowrap; }
  label.field { display: grid; gap: 4px; margin-block-start: 10px; color: var(--muted); font-size: 13px; }
  input[type="text"], input[type="password"] {
    font: inherit; color: var(--ink); border: 1.5px solid var(--rule); border-radius: 6px; padding: 8px 10px; min-block-size: 42px; inline-size: 100%;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--ink); }
  .show { display: flex; align-items: center; gap: 8px; margin-block-start: 8px; color: var(--muted); font-size: 13px; }
  button {
    min-block-size: 42px; padding: 4px 16px; border: 1.5px solid var(--ink); border-radius: 6px;
    background: var(--sheet); color: var(--ink); font: inherit; cursor: pointer;
  }
  h2 button { min-block-size: 32px; font-size: 13px; padding: 2px 10px; }
  button.primary { background: var(--ink); color: #fff; inline-size: 100%; margin-block-start: 14px; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #msg { margin-block-start: 10px; min-block-size: 1.5em; }
  #msg[data-state="ok"] { color: var(--ok); }
  #msg[data-state="err"] { color: var(--bad); }
  #now { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>配 Wi-Fi</h1>
  <p class="hint">环境光调亮度的板子要连家里的 Wi-Fi，才能去调 Mac 上的显示器。只能连 2.4 GHz 的 Wi-Fi。</p>
  <p id="now"></p>

  <form id="f" class="sheet" novalidate>
    <h2>附近的 Wi-Fi<button type="button" id="rescan">重新扫</button></h2>
    <ul id="list"><li class="hint">正在扫…（要几秒）</li></ul>
    <label class="field">没列出来就手动填名字<input type="text" name="ssid" id="ssid" autocapitalize="off" spellcheck="false" autocomplete="off"></label>
    <label class="field">密码<input type="password" name="pass" id="pass" autocomplete="off"></label>
    <label class="show"><input type="checkbox" id="showpass">显示密码</label>
    <button type="submit" class="primary" id="save">保存并连接</button>
    <div id="msg" role="status"></div>
  </form>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const bars = (rssi) => rssi > -60 ? '信号好' : rssi > -72 ? '信号还行' : '信号弱';

function scan() {
  $('list').innerHTML = '<li class="hint">正在扫…（要几秒）</li>';
  fetch('/api/scan').then((r) => r.json()).then((ns) => {
    ns.sort((a, b) => b.rssi - a.rssi);
    $('list').innerHTML = ns.length ? ns.map((n) => `<li><label><input type="radio" name="pick" value="${esc(n.ssid)}">`
      + `<span class="name">${esc(n.ssid)}${n.open ? '（不用密码）' : ''}</span><span class="sig">${bars(n.rssi)}</span></label></li>`).join('')
      : '<li class="hint">一个都没扫到：看看路由器有没有开 2.4 GHz</li>';
    document.querySelectorAll('[name="pick"]').forEach((r) => r.addEventListener('change', () => { $('ssid').value = r.value; $('pass').focus(); }));
  }).catch(() => { $('list').innerHTML = '<li class="hint">扫不了，点"重新扫"再试</li>'; });
}

fetch('/api/wifi').then((r) => r.json()).then((w) => {
  $('now').textContent = w.connected ? `现在连着 ${w.ssid}（${w.ip}）` : w.ssid ? `存的是 ${w.ssid}，现在没连上` : '还没配过 Wi-Fi';
}).catch(() => {});

$('rescan').addEventListener('click', scan);
$('showpass').addEventListener('change', () => { $('pass').type = $('showpass').checked ? 'text' : 'password'; });
$('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const ssid = $('ssid').value.trim();
  if (!ssid) { $('msg').textContent = '先选一个 Wi-Fi'; $('msg').dataset.state = 'err'; return; }
  $('save').disabled = true;
  fetch('/api/wifi', { method: 'POST', body: new URLSearchParams({ ssid, pass: $('pass').value }) }).then((r) => {
    if (!r.ok) throw new Error();
    $('msg').dataset.state = 'ok';
    $('msg').innerHTML = `存好了，板子正在重启去连 ${esc(ssid)}。<br>手机连回家里的 Wi-Fi，过半分钟打开 <b>http://ambient.local</b> 。<br>要是半分钟后又出现热点 Ambient-xxxx，就是没连上（密码不对或者不是 2.4 GHz），再连热点重配。`;
  }).catch(() => {
    $('msg').dataset.state = 'err';
    $('msg').textContent = '没存上，再试一次';
    $('save').disabled = false;
  });
});
scan();
</script>
</body>
</html>
